<div class="custom-select" [class.is-open]="isOpen()" [class.is-disabled]="isDisabled()">
  <button
    type="button"
    class="custom-select__trigger"
    [disabled]="isDisabled()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-label]="ariaLabel()"
    (click)="toggle()"
  >
    <span class="custom-select__label">{{ selectedOption()?.label || placeholder() }}</span>
    <span class="custom-select__icon" aria-hidden="true">
      <svg viewBox="0 0 20 20" focusable="false">
        <path d="M5.5 7.5 10 12l4.5-4.5" />
      </svg>
    </span>
  </button>

  @if (isOpen()) {
    <div class="custom-select__menu" role="listbox">
      @for (option of options(); track $index) {
        <button
          type="button"
          class="custom-select__option"
          [class.is-selected]="isSelected(option)"
          (click)="selectOption(option)"
        >
          <span>{{ option.label }}</span>
          @if (isSelected(option)) {
            <svg class="custom-select__check" viewBox="0 0 20 20" aria-hidden="true">
              <path d="m4.5 10.5 3.2 3.2L15.5 6" />
            </svg>
          }
        </button>
      }
    </div>
  }
</div>
