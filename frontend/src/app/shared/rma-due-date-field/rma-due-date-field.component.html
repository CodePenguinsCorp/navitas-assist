@if (canEdit()) {
  <div class="due-date-field__row">
    <app-date-picker
      class="due-date-field__picker"
      ariaLabel="Data limite"
      placeholder="Sem data limite"
      [formControl]="control"
      [minDate]="rma().entryDate"
      [ariaInvalid]="error() !== null"
      [ariaDescribedBy]="error() ? 'rma-due-date-error' : null"
      (valueChange)="pick($event)"
    />
    @if (rma().dueDate) { <app-rma-deadline-chip [rma]="rma()" mode="detail" /> }
  </div>
  @if (error(); as message) {
    <p id="rma-due-date-error" class="field-error due-date-field__error" role="alert">{{ message }}</p>
  }
} @else {
  <span class="due-date-field__static" [class.is-empty]="!rma().dueDate">
    <span class="due-date-field__text">{{ rma().dueDate ? dateLabel(rma().dueDate) : 'Sem data limite' }}</span>
    @if (rma().dueDate) { <app-rma-deadline-chip [rma]="rma()" mode="detail" /> }
  </span>
}
