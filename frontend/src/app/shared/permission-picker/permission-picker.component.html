@if (mode() === 'extras' && grantedExtras().length) {
  <div class="permission-picker__head">
    <div class="permission-picker__granted">
        <ul class="permission-chips" aria-label="Permissões extras concedidas">
          @for (item of grantedExtras(); track item.code) {
            <li class="permission-chip removable-chip">
              <span class="permission-chip__label" [appTip]="item.label">{{ item.label }}</span>
              <button type="button" [attr.aria-label]="'Remover ' + item.label" [disabled]="disabled()" (click)="toggle(item.code, false)">
                <app-icon name="close" [size]="14" />
              </button>
            </li>
          }
        </ul>
    </div>
  </div>
}

<div class="permission-picker__panel" [id]="panelId">
  @if (mode() === 'profile') { <span class="permission-picker__total" aria-live="polite">{{ total() }}</span> }

  <div class="permission-picker__grid">
    @for (module of catalog(); track module.module) {
      <fieldset class="permission-module">
        <legend>
          <button type="button" class="permission-module__toggle" [attr.aria-expanded]="isModuleOpen(module.module)" [attr.aria-controls]="panelId + '-' + module.module" (click)="toggleModule(module.module)">
            <span class="permission-module__tile" aria-hidden="true"><app-icon [name]="iconFor(module.module)" [size]="16" /></span>
            <span class="permission-module__heading">
              <span class="permission-module__name">{{ module.label }}</span>{{ ' ' }}<span class="permission-module__count">{{ onCount(module) }} de {{ module.permissions.length }}</span>
            </span>
            <span class="permission-module__chevron" [class.is-open]="isModuleOpen(module.module)" aria-hidden="true"><app-icon name="chevron" [size]="16" /></span>
          </button>
        </legend>
        <div class="permission-module__rows" [id]="panelId + '-' + module.module" [hidden]="!isModuleOpen(module.module)">
        @for (item of module.permissions; track item.code) {
          <label
            class="permission-row"
            [class.is-on]="isOn(item.code)"
            [class.is-locked]="isLocked(item.code)"
            [class.is-extra]="mode() === 'extras' && isSelected(item.code) && !isLocked(item.code)"
          >
            <input
              type="checkbox"
              role="switch"
              class="switch"
              [checked]="isOn(item.code)"
              [disabled]="disabled() || isLocked(item.code)"
              (change)="toggle(item.code, $any($event.target).checked)"
            />
            <span class="permission-row__label">{{ item.label }}</span>
            @if (isLocked(item.code)) {
              <span class="lock-badge permission-badge"><app-icon name="lock" [size]="12" />Do perfil</span>
            }
          </label>
        }
        </div>
      </fieldset>
    }
  </div>
</div>
