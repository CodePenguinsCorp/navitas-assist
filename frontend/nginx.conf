limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

map $uri $asset_cache_control {
    default "";
    /index.html "no-cache";
    "~*-[a-z0-9_-]{8,}\.(js|css|json|svg|png|jpg|jpeg|webp|ico|woff|woff2)$" "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/javascript application/javascript text/css application/json image/svg+xml;

    add_header Cache-Control $asset_cache_control;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080/api/auth/login;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
    }

    location /health {
        proxy_pass http://backend:8080/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
