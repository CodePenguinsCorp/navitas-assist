<style>

@media(max-width:820px){#navitas-global .g-app{grid-template-columns:52px minmax(0,1fr)}#navitas-global .g-side{padding-inline:7px}#navitas-global .g-brand{padding:0;justify-content:center}#navitas-global .g-brand-label,#navitas-global .g-nav-label,#navitas-global .g-group-label,#navitas-global .g-user-meta{display:none}#navitas-global .g-nav{justify-content:center;padding-inline:0}#navitas-global .g-user{flex-wrap:wrap;justify-content:center}#navitas-global .g-user .g-icon{margin:0}#navitas-global .g-page{padding:20px 16px}#navitas-global .g-top{padding-left:16px}#navitas-global .g-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}#navitas-global .g-split{grid-template-columns:minmax(0,1fr)}#navitas-global .g-filter-panel{grid-template-columns:repeat(2,minmax(0,1fr))}#navitas-global .g-detail{grid-template-columns:minmax(0,1fr) 210px}}

<div id="navitas-global" lang="pt-BR" aria-label="Proposta global de UI e UX do Navitas Assist">
  <div class="g-app" id="g-app">

<script>
(() => {
const root=document.getElementById('navitas-global'),$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const iconize=()=>{$$('button[type=submit]').forEach(b=>{b.type='button';b.setAttribute('data-local-submit','');});if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});};

if(b.dataset.movement!==undefined)openForm('movement',Number(b.dataset.movement));
if(b.dataset.partHistory!==undefined)openDialog('Histórico de movimentos',`<div class="g-dialog-body">${table(['Instante','Tipo','Variação','Saldo','Autor','Ação'],[['6 nov, 09:00','Entrada','+2 un','12 un','Ana Martins',btn('Estornar','data-form="reversal"')],['5 nov, 15:00','Reserva','—','10 un','Bruno Rocha','—']])}</div>`);
if(b.dataset.delete){const data={clients,products,users}[b.dataset.delete],row=data[Number(b.dataset.index)];openDialog('Excluir '+formTitles[b.dataset.delete],`<div class="g-dialog-body"><p>${esc(b.dataset.delete==='products'?row[1]:row[0])}</p><p class="g-note">A confirmação identifica o registro e deve apresentar impedimentos de vínculo, quando houver.</p><div class="g-actions">${btn('Cancelar','data-close')}<button type="button" class="g-button g-primary g-danger" data-confirm-delete>Excluir ${formTitles[b.dataset.delete]}</button></div></div>`,true);}
if(b.hasAttribute('data-confirm-delete')){$('#g-dialog').close();message('Confirmação demonstrada. Nenhum cadastro real foi alterado.');}
if(b.dataset.result!==undefined)openForm('result',Number(b.dataset.result));
if(b.hasAttribute('data-read-all')){noticesRead=true;$('#g-bell').hidden=true;draw();}if(b.hasAttribute('data-read-one')){b.disabled=true;b.setAttribute('aria-label','Notificação lida');}
if(b.dataset.snooze)openDialog('Adiar notificação',`<div class="g-dialog-body"><p class="g-key">${b.dataset.snooze}</p><div class="g-toolbar" style="margin-top:16px">${btn('1 hora','data-snooze-confirm')}${btn('Amanhã','data-snooze-confirm')}${btn('1 semana','data-snooze-confirm')}</div></div>`,true);
if(b.hasAttribute('data-snooze-confirm')){$('#g-dialog').close();message('Notificação adiada nesta demonstração.');}if(b.hasAttribute('data-silence')){b.textContent=b.textContent==='Silenciar'?'Reativar':'Silenciar';}
if(b.hasAttribute('data-consult'))message('Consulta demonstrativa. O período considera a entrada da OS.');if(b.hasAttribute('data-history-query'))message('Consulta por lote e série representada; resultados fictícios na lista.');
if(b.dataset.laudo){selected=rmas.find(r=>r.id===b.dataset.laudo);openDialog('Laudo técnico · '+selected.id,`<div class="g-dialog-body"><h3>${selected.client}</h3>${detailContent('Produtos')}${detailContent('Diagnóstico')}<section class="g-section"><h3>Reparo e testes</h3><p>Verificação de alimentação registrada. Parecer técnico preservado em seção própria.</p></section></div>`);}
if(b.dataset.demo){$('#g-live').textContent=b.dataset.demo;if($('#g-dialog').open){const note=document.createElement('p');note.className='g-note';note.setAttribute('role','status');note.textContent=b.dataset.demo;$('#g-dialog-content').append(note);}else message(b.dataset.demo);}
});
root.addEventListener('input',e=>{if(e.target.matches('[data-search]')){query=e.target.value;const caret=e.target.selectionStart;draw();const input=$('[data-search]');input.focus();input.setSelectionRange(caret,caret);}});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.closest('form')){e.preventDefault();const form=e.target.closest('form');if(form.reportValidity())form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));}});
root.addEventListener('change',e=>{if(e.target.dataset.select){const id=e.target.dataset.select;e.target.checked?selection.add(id):selection.delete(id);draw();}});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='g-login-form'){navigate('dashboard');$('#g-password').value='';return;}if(e.target.id==='g-edit-form'){if(formType==='result')checkedSteps.add(formIndex);if(formType==='block')selected.blocked=!selected.blocked;$('#g-dialog').close();if(['result','block','reserve','diagnosis'].includes(formType))openDetail(selected.id,true);else message('Formulário conferido na demonstração. Nenhuma alteração enviada ao sistema.');}if(e.target.id==='g-bulk-form'){$('#g-dialog').close();message('Resultado por OS e falhas parciais devem ser preservados na implementação; a demonstração não executa alterações reais.');}});
root.addEventListener('keydown',e=>{const option=e.target.closest('[data-option]');if(option&&['ArrowDown','ArrowUp','Home','End','Escape'].includes(e.key)){e.preventDefault();const options=[...option.parentElement.querySelectorAll('button')];if(e.key==='Escape'){option.parentElement.hidden=true;const trigger=$$('[data-choice]').find(t=>t.dataset.choice===option.dataset.option);trigger.setAttribute('aria-expanded','false');trigger.focus();return;}let i=options.indexOf(option);i=e.key==='Home'?0:e.key==='End'?options.length-1:(i+(e.key==='ArrowDown'?1:-1)+options.length)%options.length;options[i].focus();}const tabButton=e.target.closest('[role=tab]');if(tabButton&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const list=[...tabButton.parentElement.querySelectorAll('button')];let i=list.indexOf(tabButton);i=e.key==='Home'?0:e.key==='End'?list.length-1:(i+(e.key==='ArrowRight'?1:-1)+list.length)%list.length;const kind=tabButton.dataset.tabs,value=list[i].dataset.value;list[i].click();$$('[data-tabs]').find(b=>b.dataset.tabs===kind&&b.dataset.value===value)?.focus();}});
root.addEventListener('dragstart',e=>{const card=e.target.closest('[data-drag]');if(card&&canMove()){dragged=card.dataset.drag;e.dataTransfer?.setData('text/plain',dragged);}});root.addEventListener('dragover',e=>{if(e.target.closest('[data-drop]')&&canMove())e.preventDefault();});root.addEventListener('drop',e=>{const col=e.target.closest('[data-drop]');if(col&&dragged&&canMove()){e.preventDefault();rmas.find(r=>r.id===dragged).stage=Number(col.dataset.drop);dragged=null;draw();message('Etapa alterada apenas na demonstração; o sistema real mantém suas validações.');}});
$('#g-password-toggle').onclick=()=>{const p=$('#g-password'),show=p.type==='password';p.type=show?'text':'password';$('#g-password-toggle').setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha');$('#g-password-toggle').setAttribute('aria-pressed',String(show));};
const state=window.openai?.widgetState?.modelContent;if(state&&Object.hasOwn(labels,state.screen))screen=state.screen;if(state&&profiles[state.profile])profile=state.profile;
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.modelContent;if(s&&Object.hasOwn(labels,s.screen)){screen=s.screen;if(profiles[s.profile])profile=s.profile;draw();}});
draw();
if(globalThis.Tweak){const opts={profile:'ADMIN'};const tweak=new Tweak({container:root,onChange:()=>{profile=opts.profile;if(!allowed(screen))screen='dashboard';noticeTab='Entrada';draw();persist();}});tweak.addSelect(opts,'profile',{label:'Perfil de referência',options:Object.keys(profiles).map(value=>({value,label:profiles[value]}))});}
})();
</script>
