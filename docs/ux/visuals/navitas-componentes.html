<style>
  #navitas-kit { --k-bg:light-dark(#fff,#1d2128); --k-soft:light-dark(#f7f8fa,#242930); --k-text:light-dark(#172b4d,#e3e9f2); --k-muted:light-dark(#566171,#aeb9ca); --k-line:light-dark(#dfe3e8,#414a57); --k-brand:light-dark(#236da7,#84c1f5); --k-on:light-dark(#fff,#102b46); --k-selected:light-dark(#eaf2fa,#233b53); --k-good:light-dark(#216e4e,#90d8b6); --k-good-bg:light-dark(#e5f4ec,#1c3c31); --k-warn:light-dark(#7f5f01,#f3d176); --k-warn-bg:light-dark(#fff4d3,#42381d); --k-danger:light-dark(#ae2a19,#ffab9f); --k-danger-bg:light-dark(#ffebe6,#492c2a); font:14px/1.45 "Segoe UI",system-ui,sans-serif; color:var(--k-text); padding:16px; }
  #navitas-kit * { box-sizing:border-box; }
  #navitas-kit [hidden] { display:none!important; }
  #navitas-kit .k-surface { border:1px solid var(--k-line); border-radius:12px; background:var(--k-bg); padding:24px; }
  #navitas-kit .k-row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  #navitas-kit .k-section + .k-section { margin-top:26px; padding-top:22px; border-top:1px solid var(--k-line); }
  #navitas-kit h3 { font-size:14px; font-weight:600; margin:0 0 14px; }
  #navitas-kit p { margin:0; }
  #navitas-kit button, #navitas-kit input { font:inherit; }
  #navitas-kit button { cursor:pointer; }
  #navitas-kit button:focus-visible, #navitas-kit input:focus-visible { outline:3px solid var(--k-brand); outline-offset:3px; }
  #navitas-kit svg { width:16px; height:16px; flex-shrink:0; }
  #navitas-kit .k-button { display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:36px; border:1px solid var(--k-line); border-radius:6px; padding:6px 11px; background:var(--k-bg); color:var(--k-text); }
  #navitas-kit .k-primary { background:var(--k-brand); border-color:var(--k-brand); color:var(--k-on); font-weight:500; }
  #navitas-kit .k-icon { display:inline-grid; place-items:center; width:36px; height:36px; border:0; border-radius:6px; background:transparent; color:var(--k-muted); }
  #navitas-kit .k-icon:hover { background:var(--k-soft); }
  #navitas-kit .k-danger { color:var(--k-danger); }
  #navitas-kit .k-two { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; }
  #navitas-kit .k-field { display:grid; gap:8px; min-width:0; }
  #navitas-kit .k-label { font-size:12px; color:var(--k-muted); }
  #navitas-kit .k-select { position:relative; }
  #navitas-kit .k-trigger { width:100%; justify-content:space-between; }
  #navitas-kit .k-avatar { display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%; background:var(--k-selected); color:var(--k-brand); font-size:11px; font-weight:600; }
  #navitas-kit .k-menu { position:absolute; top:calc(100% + 5px); left:0; right:0; z-index:5; background:var(--k-bg); border:1px solid var(--k-line); border-radius:6px; padding:5px; box-shadow:0 8px 24px #00000020; }
  #navitas-kit .k-option { display:flex; align-items:center; gap:8px; width:100%; padding:8px; border:0; color:var(--k-text); background:var(--k-bg); text-align:left; border-radius:4px; }
  #navitas-kit .k-option[aria-selected=true], #navitas-kit .k-option:hover { background:var(--k-selected); }
  #navitas-kit .k-check { display:flex; align-items:center; gap:9px; min-height:36px; cursor:pointer; }
  #navitas-kit .k-check input { margin:0; accent-color:var(--k-brand); width:17px; height:17px; }
  #navitas-kit .k-chip { display:inline-flex; align-items:center; gap:5px; font-size:12px; border-radius:4px; padding:4px 7px; }
  #navitas-kit .k-info { background:var(--k-selected); color:var(--k-brand); }
  #navitas-kit .k-good { background:var(--k-good-bg); color:var(--k-good); }
  #navitas-kit .k-warn { background:var(--k-warn-bg); color:var(--k-warn); }
  #navitas-kit .k-error { background:var(--k-danger-bg); color:var(--k-danger); }
  #navitas-kit .k-dot { display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--k-good); }
  #navitas-kit .k-dot::before { content:''; border-radius:50%; width:7px; height:7px; background:currentColor; }
  #navitas-kit .k-track { background:var(--k-line); border-radius:3px; height:5px; margin-top:10px; }
  #navitas-kit .k-bar { background:var(--k-brand); width:33.333%; height:100%; border-radius:3px; }
  #navitas-kit .k-progress-meta { display:flex; justify-content:space-between; gap:10px; font-size:12px; }
  #navitas-kit .k-space { display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  #navitas-kit .k-measure { display:grid; gap:7px; color:var(--k-muted); font-size:12px; }
  #navitas-kit .k-measure span:first-child { height:6px; width:var(--size); background:var(--k-brand); border-radius:2px; }
  #navitas-kit .k-feedback { font-size:12px; color:var(--k-brand); margin-top:10px; min-height:18px; }
  @media(max-width:500px) { #navitas-kit { padding:8px; } #navitas-kit .k-surface { padding:16px; } #navitas-kit .k-two { grid-template-columns:minmax(0,1fr); gap:18px; } }
  @media(pointer:coarse) { #navitas-kit .k-button, #navitas-kit .k-icon, #navitas-kit .k-check, #navitas-kit .k-option { min-height:44px; } #navitas-kit .k-icon { min-width:44px; } }
</style>
<div class="viz-dotted-background" id="navitas-kit" lang="pt-BR" aria-label="Amostra dos componentes comuns do Navitas">
  <div class="k-surface">
    <section class="k-section"><h3>Ações</h3><div class="k-row"><button type="button" class="k-button k-primary" id="k-start"><i data-lucide="play" aria-hidden="true"></i>Iniciar protocolo</button><button type="button" class="k-button" id="k-cancel">Cancelar</button><button type="button" class="k-icon" aria-label="Editar" data-tooltip="Editar" id="k-edit"><i data-lucide="pencil" aria-hidden="true"></i></button><button type="button" class="k-icon k-danger" aria-label="Excluir" data-tooltip="Excluir" id="k-delete"><i data-lucide="trash-2" aria-hidden="true"></i></button></div><div class="k-feedback" aria-live="polite" id="k-feedback"></div></section>
    <section class="k-section k-two">
      <div class="k-field"><span class="k-label" id="k-select-label">Responsável</span><div class="k-select"><button type="button" class="k-button k-trigger" id="k-select-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="k-menu" aria-labelledby="k-select-label k-person"><span class="k-row"><span class="k-avatar" id="k-initials" aria-hidden="true">AM</span><span id="k-person">Ana Martins</span></span><i data-lucide="chevron-down" aria-hidden="true"></i></button><div class="k-menu" role="listbox" id="k-menu" aria-labelledby="k-select-label" hidden><button type="button" class="k-option" role="option" aria-selected="true" data-name="Ana Martins" data-initials="AM"><span class="k-avatar" aria-hidden="true">AM</span>Ana Martins</button><button type="button" class="k-option" role="option" aria-selected="false" data-name="Bruno Rocha" data-initials="BR"><span class="k-avatar" aria-hidden="true">BR</span>Bruno Rocha</button></div></div></div>
      <div class="k-field"><span class="k-label">Seleção</span><label class="k-check"><input type="checkbox" id="k-check" checked>Incluir acessórios</label></div>
    </section>
    <section class="k-section"><h3>Estados</h3><div class="k-row"><span class="k-chip k-info"><i data-lucide="circle-dot" aria-hidden="true"></i>Em diagnóstico</span><span class="k-chip k-good"><i data-lucide="circle-check" aria-hidden="true"></i>Concluído</span><span class="k-chip k-warn"><i data-lucide="clock-3" aria-hidden="true"></i>Vence em 2 h</span><span class="k-chip k-error"><i data-lucide="ban" aria-hidden="true"></i>Bloqueado</span><span class="k-dot">Ativo</span></div></section>
    <section class="k-section k-two"><div><h3>Progresso verificável</h3><div class="k-progress-meta"><span>Inspeção de entrada</span><span id="k-progress-label">1 de 3</span></div><div class="k-track" role="progressbar" aria-label="Inspeção de entrada" aria-valuenow="1" aria-valuemin="0" aria-valuemax="3" id="k-progress"><div class="k-bar" id="k-bar"></div></div></div><div><h3>Espaçamento</h3><div class="k-space"><div class="k-measure" style="--size:4px"><span></span><span>4</span></div><div class="k-measure" style="--size:8px"><span></span><span>8</span></div><div class="k-measure" style="--size:12px"><span></span><span>12</span></div><div class="k-measure" style="--size:16px"><span></span><span>16</span></div><div class="k-measure" style="--size:24px"><span></span><span>24</span></div><div class="k-measure" style="--size:32px"><span></span><span>32 px</span></div></div></div></section>
  </div>
</div>
<script>
(() => {
  const root=document.getElementById('navitas-kit');const $=s=>root.querySelector(s);const opts=[...root.querySelectorAll('.k-option')];
  function menu(open){$('#k-menu').hidden=!open;$('#k-select-trigger').setAttribute('aria-expanded',String(open));if(open)(opts.find(b=>b.getAttribute('aria-selected')==='true')||opts[0]).focus();else $('#k-select-trigger').focus();}
  $('#k-select-trigger').onclick=()=>menu($('#k-menu').hidden);
  $('#k-select-trigger').onkeydown=e=>{if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();menu(true);}};
  opts.forEach((b,i)=>{b.onclick=()=>{$('#k-person').textContent=b.dataset.name;$('#k-initials').textContent=b.dataset.initials;opts.forEach(x=>x.setAttribute('aria-selected',String(x===b)));menu(false);window.openai?.setWidgetState?.({modelContent:{responsavel:b.dataset.name}})?.catch(()=>{});};b.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();menu(false);}else if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?opts.length-1:(i+(e.key==='ArrowDown'?1:-1)+opts.length)%opts.length;opts[next].focus();}};});
  root.addEventListener('focusout',e=>{if(!e.relatedTarget||!root.querySelector('.k-select').contains(e.relatedTarget)){$('#k-menu').hidden=true;$('#k-select-trigger').setAttribute('aria-expanded','false');}});
  const feedback=text=>$('#k-feedback').textContent=text;
  function progress(n){$('#k-progress-label').textContent=n+' de 3';$('#k-progress').setAttribute('aria-valuenow',n);$('#k-bar').style.width=n/3*100+'%';}
  $('#k-start').onclick=()=>{progress(2);feedback('Protocolo iniciado nesta demonstração.');};$('#k-cancel').onclick=()=>{progress(1);feedback('Demonstração reiniciada.');};$('#k-edit').onclick=()=>{menu(true);};$('#k-delete').onclick=()=>{feedback('A exclusão abre uma confirmação específica na tela de Produtos.');};$('#k-check').onchange=e=>feedback(e.target.checked?'Acessórios incluídos.':'Acessórios não incluídos.');
  const stored=window.openai?.widgetState?.modelContent?.responsavel;const match=opts.find(b=>b.dataset.name===stored);if(match){$('#k-person').textContent=match.dataset.name;$('#k-initials').textContent=match.dataset.initials;opts.forEach(b=>b.setAttribute('aria-selected',String(b===match)));}
})();
</script>
