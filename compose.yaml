services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-navitas_assist}
      MYSQL_USER: ${MYSQL_USER:-navitas_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-navitas123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_ROOT_HOST: "%"
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-navitas_assist}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${MYSQL_USER:-navitas_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-navitas123}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      DEADLINE_WARNING_DAYS: ${DEADLINE_WARNING_DAYS:-7}
      NOTIFICATIONS_EMAIL_ENABLED: ${NOTIFICATIONS_EMAIL_ENABLED:-false}
      NOTIFICATIONS_EMAIL_PROVIDER: ${NOTIFICATIONS_EMAIL_PROVIDER:-fake}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      NOTIFICATIONS_EMAIL_POLL_MS: ${NOTIFICATIONS_EMAIL_POLL_MS:-5000}
      NOTIFICATIONS_EMAIL_BATCH_SIZE: ${NOTIFICATIONS_EMAIL_BATCH_SIZE:-50}
      NOTIFICATIONS_EMAIL_DAILY_LIMIT: ${NOTIFICATIONS_EMAIL_DAILY_LIMIT:-100}
      NOTIFICATIONS_EMAIL_MONTHLY_LIMIT: ${NOTIFICATIONS_EMAIL_MONTHLY_LIMIT:-3000}
      NOTIFICATIONS_EMAIL_SEND_INTERVAL_MS: ${NOTIFICATIONS_EMAIL_SEND_INTERVAL_MS:-500}
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4200}:80"

volumes:
  mysql_data:
