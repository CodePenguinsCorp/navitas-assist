services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-navitas_assist}
      POSTGRES_USER: ${POSTGRES_USER:-navitas_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-navitas123}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-navitas_assist}
      DB_USER: ${POSTGRES_USER:-navitas_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-navitas123}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      DEADLINE_WARNING_DAYS: ${DEADLINE_WARNING_DAYS:-7}
      NOTIFICATIONS_EMAIL_ENABLED: ${NOTIFICATIONS_EMAIL_ENABLED:-false}
      NOTIFICATIONS_EMAIL_PROVIDER: ${NOTIFICATIONS_EMAIL_PROVIDER:-fake}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      NOTIFICATIONS_EMAIL_POLL_MS: ${NOTIFICATIONS_EMAIL_POLL_MS:-5000}
      NOTIFICATIONS_EMAIL_BATCH_SIZE: ${NOTIFICATIONS_EMAIL_BATCH_SIZE:-50}
      NOTIFICATIONS_EMAIL_DAILY_LIMIT: ${NOTIFICATIONS_EMAIL_DAILY_LIMIT:-100}
      NOTIFICATIONS_EMAIL_MONTHLY_LIMIT: ${NOTIFICATIONS_EMAIL_MONTHLY_LIMIT:-3000}
      NOTIFICATIONS_EMAIL_SEND_INTERVAL_MS: ${NOTIFICATIONS_EMAIL_SEND_INTERVAL_MS:-500}
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4200}:80"

volumes:
  postgres_data:
