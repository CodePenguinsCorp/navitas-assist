name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.9-eclipse-temurin-17
    # O job roda dentro de um contêiner sem o socket do Docker, então o Testcontainers não sobe aqui: a suíte usa o
    # PostgreSQL de serviço pelas variáveis TEST_DB_*. O usuário é o dono do servidor (os testes de migração criam
    # bancos próprios e a baseline cria a extensão unaccent).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: navitas_ci
          POSTGRES_USER: navitas_ci
          POSTGRES_PASSWORD: navitas-ci-test
        options: >-
          --health-cmd "pg_isready -U navitas_ci -d navitas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tests and build (PostgreSQL 16)
        env:
          TEST_DB_URL: jdbc:postgresql://postgres:5432/navitas_ci
          TEST_DB_USER: navitas_ci
          TEST_DB_PASSWORD: navitas-ci-test
        run: mvn -B -ntp verify
