name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      # Lidos pelos testes do frontend (core/permissions.spec.ts) para conferir catálogo e fixtures.
      - "backend/src/main/java/br/com/navitasassist/access/Permission.java"
      - "backend/src/main/java/br/com/navitasassist/access/PermissionModule.java"
      - "backend/src/main/resources/db/migration/V1__baseline.sql"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      # Lidos pelos testes do frontend (core/permissions.spec.ts) para conferir catálogo e fixtures.
      - "backend/src/main/java/br/com/navitasassist/access/Permission.java"
      - "backend/src/main/java/br/com/navitasassist/access/PermissionModule.java"
      - "backend/src/main/resources/db/migration/V1__baseline.sql"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test -- --watch=false
      - name: Build production bundle
        run: npm run build
