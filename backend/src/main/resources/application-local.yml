spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/navitas_assist?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:navitas_app}
    password: ${DB_PASSWORD:navitas123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        secure: false

navitas:
  security:
    cookie-secure: false
    seed-admin:
      username: ${APP_ADMIN_USERNAME:admin}
      password: ${APP_ADMIN_PASSWORD:admin123}
      full-name: ${APP_ADMIN_FULL_NAME:Administrador}
