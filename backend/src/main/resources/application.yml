spring:
  application:
    name: navitas-assist-backend
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    # Pool pequeno: cabe no limite de conexões de um PostgreSQL gerenciado gratuito, que também pode suspender o banco
    # ocioso (a primeira conexão demora; daí o timeout de 30 s e nenhuma conexão ociosa obrigatória).
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: 0
      idle-timeout: 120000
      max-lifetime: 300000
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  # O Flyway pode usar outro endpoint (ex.: o direto, quando o app passa por um pooler em modo transaction).
  # Sem MIGRATION_DB_*, usa a mesma conexão do app.
  flyway:
    url: ${MIGRATION_DB_URL:${spring.datasource.url}}
    user: ${MIGRATION_DB_USER:${spring.datasource.username}}
    password: ${MIGRATION_DB_PASSWORD:${spring.datasource.password}}
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: strict

navitas:
  deadline:
    warning-days: ${DEADLINE_WARNING_DAYS:7}
  notifications:
    async:
      core-pool-size: ${NOTIFICATIONS_ASYNC_CORE_POOL_SIZE:2}
      max-pool-size: ${NOTIFICATIONS_ASYNC_MAX_POOL_SIZE:4}
      queue-capacity: ${NOTIFICATIONS_ASYNC_QUEUE_CAPACITY:500}
    email:
      enabled: ${NOTIFICATIONS_EMAIL_ENABLED:false}
      provider: ${NOTIFICATIONS_EMAIL_PROVIDER:fake}
      api-key: ${RESEND_API_KEY:}
      from: ${MAIL_FROM:}
      app-base-url: ${APP_BASE_URL:}
      poll-ms: ${NOTIFICATIONS_EMAIL_POLL_MS:5000}
      batch-size: ${NOTIFICATIONS_EMAIL_BATCH_SIZE:50}
      daily-limit: ${NOTIFICATIONS_EMAIL_DAILY_LIMIT:100}
      monthly-limit: ${NOTIFICATIONS_EMAIL_MONTHLY_LIMIT:3000}
      send-interval-ms: ${NOTIFICATIONS_EMAIL_SEND_INTERVAL_MS:500}
  security:
    cookie-secure: ${SESSION_COOKIE_SECURE:true}

# Drivers podem incluir o endereço duplicado no diagnóstico de constraints.
# A API traduz colisões conhecidas para mensagens seguras.
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
