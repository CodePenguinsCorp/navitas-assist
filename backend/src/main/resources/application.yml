spring:
  application:
    name: navitas-assist-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/navitas_assist?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:navitas_app}
    password: ${DB_PASSWORD:navitas123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

navitas:
  security:
    seed-admin:
      username: ${APP_ADMIN_USERNAME:admin}
      password: ${APP_ADMIN_PASSWORD:admin123}
      full-name: ${APP_ADMIN_FULL_NAME:Administrador}
