spring:
  application:
    name: navitas-assist-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    validate-on-migrate: true
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
      "[mail.smtp.timeout]": ${MAIL_SMTP_READ_TIMEOUT_MS:10000}
      "[mail.smtp.writetimeout]": ${MAIL_SMTP_WRITE_TIMEOUT_MS:10000}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: strict

navitas:
  deadline:
    warning-days: ${DEADLINE_WARNING_DAYS:7}
  notifications:
    async:
      core-pool-size: ${NOTIFICATIONS_ASYNC_CORE_POOL_SIZE:2}
      max-pool-size: ${NOTIFICATIONS_ASYNC_MAX_POOL_SIZE:4}
      queue-capacity: ${NOTIFICATIONS_ASYNC_QUEUE_CAPACITY:500}
    email:
      enabled: ${NOTIFICATIONS_EMAIL_ENABLED:false}
      domain: ${NOTIFICATIONS_EMAIL_DOMAIN:}
      from: ${NOTIFICATIONS_EMAIL_FROM:navitas-assist@localhost}
  security:
    cookie-secure: ${SESSION_COOKIE_SECURE:true}
