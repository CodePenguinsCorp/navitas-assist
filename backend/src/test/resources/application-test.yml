# A conexão vem de PostgresContextInitializer (Testcontainers localmente; TEST_DB_* no CI).
spring:
  datasource:
    hikari:
      # Cada contexto Spring em cache guarda o próprio pool; conexões ociosas fecham logo para não esgotar o
      # max_connections (100 por padrão) do PostgreSQL de serviço do CI.
      idle-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 0
  servlet:
    session:
      cookie:
        secure: false

navitas:
  security:
    cookie-secure: false
