spring:
  datasource:
    url: jdbc:h2:mem:navitas_assist;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        type:
          preferred_instant_jdbc_type: TIMESTAMP

server:
  port: 0
  servlet:
    session:
      cookie:
        secure: false

navitas:
  notifications:
    sla-scan:
      enabled: false
  security:
    cookie-secure: false
    seed-admin:
      username: admin
      password: admin123
      full-name: Administrador
