services:
  mysql:
    image: mysql:8.0
    container_name: navitas-assist-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE obrigatorio}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER obrigatorio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD obrigatorio}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD obrigatorio}
      MYSQL_ROOT_HOST: "%"
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE obrigatorio}
    container_name: navitas-assist-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      DEADLINE_WARNING_DAYS: ${DEADLINE_WARNING_DAYS:-7}
      NOTIFICATIONS_EMAIL_ENABLED: ${NOTIFICATIONS_EMAIL_ENABLED:-false}
      NOTIFICATIONS_EMAIL_PROVIDER: ${NOTIFICATIONS_EMAIL_PROVIDER:-fake}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      NOTIFICATIONS_EMAIL_POLL_MS: ${NOTIFICATIONS_EMAIL_POLL_MS:-5000}
      NOTIFICATIONS_EMAIL_BATCH_SIZE: ${NOTIFICATIONS_EMAIL_BATCH_SIZE:-50}
      NOTIFICATIONS_EMAIL_DAILY_LIMIT: ${NOTIFICATIONS_EMAIL_DAILY_LIMIT:-100}
      NOTIFICATIONS_EMAIL_MONTHLY_LIMIT: ${NOTIFICATIONS_EMAIL_MONTHLY_LIMIT:-3000}
      NOTIFICATIONS_EMAIL_SEND_INTERVAL_MS: ${NOTIFICATIONS_EMAIL_SEND_INTERVAL_MS:-500}
      SESSION_COOKIE_SECURE: "true"
    expose:
      - "8080"

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE obrigatorio}
    container_name: navitas-assist-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  mysql_data:
